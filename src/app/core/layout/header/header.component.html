<header class="site-header" [class.scrolled]="isScrolled()">
  <div class="container header-container">
    <!-- Brand Logo -->
    <a routerLink="/" (click)="closeMobileMenu()" class="brand-logo" aria-label="BYR AutoCab Home">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
          <!-- Speaker Cabinet Outer Box -->
          <rect x="4" y="4" width="28" height="28" rx="3" stroke="#38bdf8" stroke-width="2" fill="#0c1220" fill-opacity="0.9"/>
          <!-- Recessed Baffle Line -->
          <rect x="7" y="7" width="22" height="22" rx="1.5" stroke="#1e293b" stroke-width="1.5" fill="#111a2e"/>
          <!-- Speaker Cone Outer Rim -->
          <circle cx="18" cy="18" r="8.5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 1"/>
          <!-- Speaker Cone Center Dust Cap -->
          <circle cx="18" cy="18" r="3.5" fill="#f59e0b"/>
          <!-- Corner Protectors -->
          <path d="M4 8V4H8" stroke="#38bdf8" stroke-width="2"/>
          <path d="M32 8V4H28" stroke="#38bdf8" stroke-width="2"/>
          <path d="M4 28V32H8" stroke="#38bdf8" stroke-width="2"/>
          <path d="M32 28V32H28" stroke="#38bdf8" stroke-width="2"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">BYR <span class="accent">AutoCab</span></span>
        <span class="brand-tag">CUSTOM SPEAKER CABINET &amp; CUT ENGINE</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav" aria-label="Main Navigation">
      <a routerLink="/" fragment="configurations" class="nav-link">Speaker Enclosures</a>
      <a routerLink="/" fragment="methods" class="nav-link">Enclosure Joinery</a>
      <a routerLink="/" fragment="how-it-works" class="nav-link">How It Works</a>
      <a routerLink="/" fragment="specs" class="nav-link">Acoustic Specs</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <div class="status-badge" title="Engine Status">
        <span class="status-dot"></span>
        <span class="status-text">Audio Ready</span>
      </div>

      <a routerLink="/configurator" class="btn-cta">
        <svg class="cta-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        <span>Start a Cabinet</span>
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button
        type="button"
        class="mobile-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle navigation menu">
        <span class="hamburger-bar" [class.open]="isMobileMenuOpen()"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-drawer" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
      <div class="mobile-drawer-content">
        <nav class="mobile-nav">
          <a routerLink="/" fragment="configurations" (click)="closeMobileMenu()" class="mobile-nav-link">
            <span class="mobile-nav-icon">🔊</span>
            <span>Speaker Enclosures</span>
          </a>
          <a routerLink="/" fragment="methods" (click)="closeMobileMenu()" class="mobile-nav-link">
            <span class="mobile-nav-icon">🪵</span>
            <span>Enclosure Joinery</span>
          </a>
          <a routerLink="/" fragment="how-it-works" (click)="closeMobileMenu()" class="mobile-nav-link">
            <span class="mobile-nav-icon">⚡</span>
            <span>How It Works</span>
          </a>
          <a routerLink="/" fragment="specs" (click)="closeMobileMenu()" class="mobile-nav-link">
            <span class="mobile-nav-icon">📊</span>
            <span>Acoustic Specs</span>
          </a>
        </nav>

        <div class="mobile-drawer-cta">
          <a routerLink="/configurator" (click)="closeMobileMenu()" class="btn-cta full-width">
            <svg class="cta-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            <span>Start a Cabinet</span>
          </a>
        </div>
      </div>
    </div>
  }
</header>
